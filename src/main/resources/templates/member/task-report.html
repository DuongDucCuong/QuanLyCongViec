<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo cáo & Nhận xét - Quản lý Công việc</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-container">
        <!-- Sidebar -->
        <div th:replace="~{layout/fragments :: sidebar('member-task')}"></div>

        <!-- Main Wrapper -->
        <div class="main-wrapper">
            <!-- Header -->
            <div th:replace="~{layout/fragments :: header('Lịch sử Báo cáo & Nhận xét')}"></div>

            <!-- Content Body -->
            <main class="content-body">
                <!-- Alert Box -->
                <div id="alertBox" class="alert-box"></div>

                <!-- History Table -->
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">Lịch sử nhận xét của Trưởng nhóm</h2>
                    </div>
                    <div class="table-container">
                        <table class="custom-table">
                            <thead>
                                <tr>
                                    <th>Mã việc</th>
                                    <th>Công việc con</th>
                                    <th>Báo cáo đã gửi</th>
                                    <th>Nhận xét từ Leader</th>
                                    <th>Trạng thái</th>
                                </tr>
                            </thead>
                            <tbody id="memberTaskHistoryTable">
                                <tr>
                                    <td colspan="5" style="text-align: center; color: var(--text-secondary);">Đang tải lịch sử công việc...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>

            <!-- Footer -->
            <div th:replace="~{layout/fragments :: footer}"></div>
        </div>
    </div>

    <!-- App JS -->
    <script th:src="@{/js/app.js}"></script>
    <!-- Page JS -->
    <script th:src="@{/js/member-dashboard.js}"></script>
</body>
</html>
