<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Dự án - Quản lý Công việc</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .btn-danger {
            background-color: var(--danger);
            color: white;
        }
        .btn-danger:hover {
            background-color: #dc2626;
        }
        .btn-warning {
            background-color: var(--warning);
            color: white;
        }
        .btn-warning:hover {
            background-color: #d97706;
        }
        .action-buttons {
            display: flex;
            gap: 0.5rem;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Sidebar -->
    <div th:replace="~{layout/fragments :: sidebar('admin-projects')}"></div>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
        <!-- Header -->
        <div th:replace="~{layout/fragments :: header('Quản lý Dự án')}"></div>

        <!-- Content Body -->
        <main class="content-body">
            <!-- Alert Box -->
            <div id="alertBox" class="alert-box"></div>

            <div class="card-header" style="margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center;">
                <h2 class="card-title">Danh sách các Dự án</h2>
                <button onclick="openProjectModal(false)" class="btn btn-primary">+ Tạo dự án mới</button>
            </div>

            <!-- Projects Table -->
            <div class="card">
                <div class="table-container">
                    <table class="custom-table">
                        <thead>
                        <tr>
                            <th>Mã dự án</th>
                            <th>Tên dự án</th>
                            <th>Mô tả</th>
                            <th>Ngày bắt đầu</th>
                            <th>Ngày kết thúc</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                        </tr>
                        </thead>
                        <tbody id="projectsTableBody">
                        <tr>
                            <td colspan="7" style="text-align: center; color: var(--text-secondary);">Đang tải danh sách dự án...</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <div th:replace="~{layout/fragments :: footer}"></div>
    </div>
</div>

<!-- Modal Form (Create / Edit Project) -->
<div id="projectModal" class="modal-overlay">
    <div class="modal-box">
        <div class="modal-header">
            <h3 class="modal-title" id="modalTitle">Tạo dự án mới</h3>
            <button onclick="closeProjectModal()" class="modal-close">&times;</button>
        </div>

        <input type="hidden" id="projectId">

        <div class="form-group">
            <label class="form-label" for="projectName">Tên dự án</label>
            <input type="text" id="projectName" class="form-control" placeholder="Nhập tên dự án">
        </div>

        <div class="form-group">
            <label class="form-label" for="projectDescription">Mô tả dự án</label>
            <textarea id="projectDescription" class="form-control" placeholder="Nhập mô tả dự án..."></textarea>
        </div>

        <div class="form-group">
            <label class="form-label" for="startDate">Ngày bắt đầu</label>
            <input type="date" id="startDate" class="form-control">
        </div>

        <div class="form-group">
            <label class="form-label" for="endDate">Ngày kết thúc</label>
            <input type="date" id="endDate" class="form-control">
        </div>

        <div class="form-group">
            <label class="form-label" for="statusSelect">Trạng thái</label>
            <select id="statusSelect" class="form-control">
                <option value="PLANNING">Lên kế hoạch (Planning)</option>
                <option value="ONGOING">Đang triển khai (Ongoing)</option>
                <option value="COMPLETED">Đã hoàn thành (Completed)</option>
                <option value="SUSPENDED">Tạm dừng (Suspended)</option>
            </select>
        </div>

        <div class="modal-footer">
            <button onclick="closeProjectModal()" class="btn btn-secondary">Hủy</button>
            <button onclick="submitProjectForm()" class="btn btn-primary">Xác nhận</button>
        </div>
    </div>
</div>

<!-- App JS -->
<script th:src="@{/js/app.js}"></script>
<!-- Page JS -->
<script th:src="@{/js/admin-projects.js}"></script>
</body>
</html>
