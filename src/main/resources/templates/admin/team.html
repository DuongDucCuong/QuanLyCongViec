<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Nhóm - Quản lý Công việc</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-container">
        <!-- Sidebar -->
        <div th:replace="~{layout/fragments :: sidebar('admin-team')}"></div>

        <!-- Main Wrapper -->
        <div class="main-wrapper">
            <!-- Header -->
            <div th:replace="~{layout/fragments :: header('Quản lý Nhóm làm việc')}"></div>

            <!-- Content Body -->
            <main class="content-body">
                <!-- Alert Box -->
                <div id="alertBox" class="alert-box"></div>

                <div class="card-header" style="margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center;">
                    <h2 class="card-title">Danh sách các Nhóm</h2>
                    <button onclick="openCreateTeamModal()" class="btn btn-primary">+ Tạo nhóm mới</button>
                </div>

                <!-- Teams Table -->
                <div class="card">
                    <div class="table-container">
                        <table class="custom-table">
                            <thead>
                                <tr>
                                    <th>Mã nhóm</th>
                                    <th>Tên nhóm</th>
                                    <th>Trưởng nhóm (Leader)</th>
                                    <th>Số lượng thành viên</th>
                                    <th>Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="teamsTableBody">
                                <tr>
                                    <td colspan="5" style="text-align: center; color: var(--text-secondary);">Đang tải danh sách nhóm...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>

            <!-- Footer -->
            <div th:replace="~{layout/fragments :: footer}"></div>
        </div>
    </div>

    <!-- Modal Create Team -->
    <div id="createTeamModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3 class="modal-title">Tạo Nhóm làm việc mới</h3>
                <button onclick="closeCreateTeamModal()" class="modal-close">&times;</button>
            </div>
            <div class="form-group">
                <label class="form-label" for="teamName">Tên nhóm</label>
                <input type="text" id="teamName" class="form-control" placeholder="Ví dụ: Nhóm Phát triển Mobile">
            </div>
            <div class="form-group">
                <label class="form-label" for="teamLeaderSelect">Chỉ định Trưởng nhóm (Tùy chọn)</label>
                <select id="teamLeaderSelect" class="form-control">
                    <option value="">-- Chọn trưởng nhóm --</option>
                </select>
            </div>
            <div class="modal-footer">
                <button onclick="closeCreateTeamModal()" class="btn btn-secondary">Hủy</button>
                <button onclick="submitCreateTeam()" class="btn btn-primary">Xác nhận tạo</button>
            </div>
        </div>
    </div>

    <!-- Modal Assign Leader -->
    <div id="assignLeaderModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3 class="modal-title">Bổ nhiệm Trưởng nhóm</h3>
                <button onclick="closeAssignLeaderModal()" class="modal-close">&times;</button>
            </div>
            <input type="hidden" id="assignTeamId">
            <div class="form-group">
                <label class="form-label">Tên nhóm</label>
                <input type="text" id="assignTeamName" class="form-control" readonly>
            </div>
            <div class="form-group">
                <label class="form-label" for="leaderSelect">Chọn Trưởng nhóm mới</label>
                <select id="leaderSelect" class="form-control">
                    <option value="">-- Chọn thành viên --</option>
                </select>
            </div>
            <div class="modal-footer">
                <button onclick="closeAssignLeaderModal()" class="btn btn-secondary">Hủy</button>
                <button onclick="submitAssignLeader()" class="btn btn-primary">Bổ nhiệm</button>
            </div>
        </div>
    </div>

    <!-- Modal Xem Chi Tiết Nhóm và Công Việc Thành Viên -->
    <div id="teamDetailsModal" class="modal-overlay">
        <div class="modal-box" style="max-width: 800px; width: 90%;">
            <div class="modal-header">
                <h3 class="modal-title" id="detailsModalTitle">Chi tiết Nhóm</h3>
                <button onclick="closeTeamDetailsModal()" class="modal-close">&times;</button>
            </div>
            <div class="modal-body" style="max-height: 65vh; overflow-y: auto; padding: 1rem 0;">

                <!-- Tóm tắt thông tin nhóm -->
                <div class="team-info-summary" style="display: flex; gap: 2rem; margin-bottom: 1.5rem; background: var(--bg-primary); padding: 1rem; border-radius: var(--border-radius-md); border: 1px solid var(--border-color);">
                    <div>
                        <span style="font-size: 0.85rem; color: var(--text-secondary); display: block;">Trưởng nhóm (Leader)</span>
                        <strong id="detailsTeamLeader" style="color: var(--text-primary); font-size: 1.05rem;">Chưa có</strong>
                    </div>
                    <div style="border-left: 1px solid var(--border-color); padding-left: 2rem;">
                        <span style="font-size: 0.85rem; color: var(--text-secondary); display: block;">Quy mô thành viên</span>
                        <strong id="detailsTeamMemberCount" style="color: var(--text-primary); font-size: 1.05rem;">0 thành viên</strong>
                    </div>
                </div>

                <h4 style="margin-bottom: 1rem; color: var(--text-primary); border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; font-size: 1.05rem; font-weight: 600;">
                    👥 Danh sách thành viên & Công việc con đang làm
                </h4>

                <!-- Container chứa danh sách thành viên -->
                <div id="detailsMembersContainer">
                    <!-- Sẽ được điền động bằng JavaScript -->
                </div>
            </div>
            <div class="modal-footer">
                <button onclick="closeTeamDetailsModal()" class="btn btn-secondary">Đóng</button>
            </div>
        </div>
    </div>

    <!-- App JS -->
    <script th:src="@{/js/app.js}"></script>
    <!-- Page JS -->
    <script th:src="@{/js/admin/team.js}"></script>
</body>
</html>
