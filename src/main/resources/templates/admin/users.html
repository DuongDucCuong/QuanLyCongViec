<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Thành viên - Quản lý Công việc</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .btn-danger {
            background-color: var(--danger);
            color: white;
        }
        .btn-danger:hover {
            background-color: #dc2626;
        }
        .btn-warning {
            background-color: var(--warning);
            color: white;
        }
        .btn-warning:hover {
            background-color: #d97706;
        }
        .action-buttons {
            display: flex;
            gap: 0.5rem;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Sidebar -->
    <div th:replace="~{layout/fragments :: sidebar('admin-users')}"></div>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
        <!-- Header -->
        <div th:replace="~{layout/fragments :: header('Quản lý thành viên hệ thống')}"></div>

        <!-- Content Body -->
        <main class="content-body">
            <!-- Alert Box -->
            <div id="alertBox" class="alert-box"></div>

            <div class="card-header" style="margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center;">
                <h2 class="card-title">Danh sách Thành viên</h2>
                <button onclick="openUserModal(false)" class="btn btn-primary">+ Thêm thành viên</button>
            </div>

            <!-- Users Table -->
            <div class="card">
                <div class="table-container">
                    <table class="custom-table">
                        <thead>
                        <tr>
                            <th>Mã NV</th>
                            <th>Tên đăng nhập</th>
                            <th>Email</th>
                            <th>Số điện thoại</th>
                            <th>Vai trò</th>
                            <th>Nhóm làm việc</th>
                            <th>Thao tác</th>
                        </tr>
                        </thead>
                        <tbody id="usersTableBody">
                        <tr>
                            <td colspan="7" style="text-align: center; color: var(--text-secondary);">Đang tải danh sách thành viên...</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <div th:replace="~{layout/fragments :: footer}"></div>
    </div>
</div>

<!-- Modal Form (Create / Edit User) -->
<div id="userModal" class="modal-overlay">
    <div class="modal-box">
        <div class="modal-header">
            <h3 class="modal-title" id="modalTitle">Thêm thành viên mới</h3>
            <button onclick="closeUserModal()" class="modal-close">&times;</button>
        </div>

        <input type="hidden" id="userId">

        <div class="form-group" id="usernameGroup">
            <label class="form-label" for="username">Tên đăng nhập</label>
            <input type="text" id="username" class="form-control" placeholder="Nhập tên đăng nhập duy nhất">
        </div>

        <div class="form-group">
            <label class="form-label" for="password" id="passwordLabel">Mật khẩu</label>
            <input type="password" id="password" class="form-control" placeholder="Nhập mật khẩu">
            <small id="passwordHelp" style="color: var(--text-secondary); display: none; font-size: 0.8rem;">Để trống nếu giữ nguyên mật khẩu cũ</small>
        </div>

        <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input type="email" id="email" class="form-control" placeholder="vi-du@gmail.com">
        </div>

        <div class="form-group">
            <label class="form-label" for="phoneNumber">Số điện thoại</label>
            <input type="text" id="phoneNumber" class="form-control" placeholder="Nhập số điện thoại">
        </div>

        <div class="form-group">
            <label class="form-label" for="roleSelect">Vai trò</label>
            <select id="roleSelect" class="form-control">
                <option value="ROLE_USER">Nhân viên</option>
                <option value="ROLE_LEADER">Trưởng nhóm</option>
                <option value="ROLE_ADMIN">Sếp / Admin</option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label" for="teamSelect">Nhóm làm việc (Tùy chọn)</label>
            <select id="teamSelect" class="form-control">
                <option value="">-- Chọn nhóm làm việc --</option>
            </select>
        </div>

        <div class="modal-footer">
            <button onclick="closeUserModal()" class="btn btn-secondary">Hủy</button>
            <button onclick="submitUserForm()" class="btn btn-primary">Xác nhận</button>
        </div>
    </div>
</div>

<!-- App JS -->
<script th:src="@{/js/app.js}"></script>
<!-- Page JS -->
<script th:src="@{/js/admin-users.js}"></script>
</body>
</html>
