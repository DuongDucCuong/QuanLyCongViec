<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập hệ thống</title>
    <!-- Nhúng thư viện TailwindCSS để tạo giao diện hiện đại -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Nhúng Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

<div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-200">
    <div class="text-center mb-8">
        <h2 class="text-3xl font-bold text-slate-800">Đăng nhập</h2>
        <p class="text-slate-500 mt-2 text-sm">Chào mừng bạn quay lại hệ thống quản lý</p>
    </div>

    <!-- Khung hiển thị thông báo lỗi -->
    <div id="messageBox" class="hidden mb-6 p-4 rounded-xl text-sm font-medium text-center bg-red-100 text-red-800"></div>

    <form id="loginForm" class="space-y-5">
        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">Tên đăng nhập</label>
            <input type="text" id="username" required
                   class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                   placeholder="Nhập tên tài khoản">
        </div>

        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">Mật khẩu</label>
            <input type="password" id="password" required
                   class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                   placeholder="Nhập mật khẩu">
        </div>

        <button type="submit"
                class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transition duration-200">
            Đăng nhập
        </button>
    </form>

    <div class="mt-6 text-center text-sm text-slate-600">
        Chưa có tài khoản?
        <a href="/register" class="text-blue-600 hover:underline font-semibold">Đăng ký tài khoản mới</a>
    </div>
</div>

<script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
        e.preventDefault();

        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const messageBox = document.getElementById("messageBox");

        // Gọi API Đăng nhập ở Backend
        fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
        })
            .then(async res => {
                if (res.ok) {
                    const data = await res.json();

                    // Lưu Token JWT, username và role vào bộ nhớ trình duyệt (localStorage)
                    localStorage.setItem("token", data.token);
                    localStorage.setItem("username", data.username);
                    localStorage.setItem("role", data.role);

                    // Phân quyền chuyển hướng thông minh tùy theo vai trò (Role):
                    if (data.role === "ROLE_ADMIN") {
                        // Sếp sang trang quản trị của Admin
                        window.location.href = "/admin/dashboard";
                    } else {
                        // Trưởng nhóm và Nhân viên sang trang làm việc của Member
                        window.location.href = "/member/dashboard";
                    }
                } else {
                    const errorMsg = await res.text();
                    messageBox.innerText = "❌ Sai tài khoản hoặc mật khẩu!";
                    messageBox.classList.remove("hidden");
                }
            })
            .catch(err => {
                messageBox.innerText = "❌ Lỗi kết nối đến máy chủ!";
                messageBox.classList.remove("hidden");
            });
    });
</script>
</body>
</html>
