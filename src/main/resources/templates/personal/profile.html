<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ cá nhân của tôi - Quản lý Công việc</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .profile-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }
        .avatar-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-lg);
            padding: 2rem;
            background: var(--bg-secondary);
        }
        .avatar-image {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary-light);
            margin-bottom: 1.5rem;
        }
        .row-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
            margin-bottom: 1.25rem;
        }
        @media (max-width: 768px) {
            .profile-container { grid-template-columns: 1fr; }
            .row-group { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Sidebar -->
    <div th:replace="~{layout/fragments :: sidebar('profile')}"></div>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
        <!-- Header -->
        <div th:replace="~{layout/fragments :: header('Hồ sơ cá nhân của tôi')}"></div>

        <!-- Content Body -->
        <main class="content-body">
            <div id="alertBox" class="alert-box"></div>

            <div class="profile-container">
                <!-- KHỐI 1: FORM THÔNG TIN CÁ NHÂN -->
                <div class="card">
                    <h3 class="card-title" style="margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">
                        I. THÔNG TIN CÁ NHÂN
                    </h3>
                    <form id="profileForm">
                        <div class="row-group">
                            <div class="form-group">
                                <label class="form-label">Tên đăng nhập (Không thể sửa)</label>
                                <input type="text" id="profileUsername" class="form-control" readonly style="background-color: var(--bg-primary);">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Họ và tên</label>
                                <input type="text" id="profileFullName" class="form-control" placeholder="Nhập họ và tên đầy đủ" required>
                            </div>
                        </div>

                        <div class="row-group">
                            <div class="form-group">
                                <label class="form-label">Ngày sinh</label>
                                <input type="text" id="profileDOB" class="form-control" placeholder="Ví dụ: 10-02-1991">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Giới tính</label>
                                <select id="profileGender" class="form-control">
                                    <option value="">-- Chọn giới tính --</option>
                                    <option value="Nam">Nam</option>
                                    <option value="Nữ">Nữ</option>
                                    <option value="Khác">Khác</option>
                                </select>
                            </div>
                        </div>

                        <div class="row-group">
                            <div class="form-group">
                                <label class="form-label">Nơi sinh</label>
                                <input type="text" id="profilePlaceOfBirth" class="form-control" placeholder="Ví dụ: Tiên Phước - Quảng Nam">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Điện thoại liên hệ</label>
                                <input type="text" id="profilePhone" class="form-control" required>
                            </div>
                        </div>

                        <div class="row-group">
                            <div class="form-group">
                                <label class="form-label">Địa chỉ Email</label>
                                <input type="email" id="profileEmail" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Nhóm làm việc (Team)</label>
                                <input type="text" id="profileTeam" class="form-control" readonly style="background-color: var(--bg-primary);">
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Địa chỉ liên hệ</label>
                            <textarea id="profileAddress" class="form-control" rows="2" placeholder="Nhập địa chỉ đầy đủ"></textarea>
                        </div>

                        <div style="text-align: right; margin-top: 1rem;">
                            <button type="submit" class="btn btn-primary">Lưu thay đổi hồ sơ</button>
                        </div>
                    </form>
                </div>

                <!-- KHỐI 2: ẢNH CHÂN DUNG & TỆP CV -->
                <div class="card" style="display: flex; flex-direction: column; gap: 1.5rem;">
                    <!-- Thẻ Upload ảnh chân dung -->
                    <div class="avatar-box">
                        <img id="profileAvatarImg" class="avatar-image" src="" alt="Avatar">
                        <input type="file" id="avatarFileInput" style="display: none;" accept="image/*">
                        <button onclick="document.getElementById('avatarFileInput').click()" class="btn btn-secondary btn-sm" style="margin-bottom: 0.5rem;">Chọn hình ảnh</button>
                        <button onclick="uploadAvatar()" class="btn btn-primary btn-sm">Tải ảnh lên</button>
                    </div>

                    <!-- Thẻ Upload CV đính kèm -->
                    <div class="card" style="padding: 1.25rem;">
                        <h4 style="margin-bottom: 1rem; font-weight: 600; font-size: 0.95rem;">📄 Hồ sơ cá nhân (CV)</h4>

                        <div id="cvDownloadContainer" style="margin-bottom: 1rem; display: none;">
                            <a id="cvDownloadLink" href="#" class="btn btn-secondary btn-sm" style="width: 100%; text-align: center;" target="_blank">📥 Tải xuống CV hiện tại</a>
                        </div>

                        <input type="file" id="cvFileInput" class="form-control" style="margin-bottom: 0.75rem;" accept=".pdf,.doc,.docx">
                        <button onclick="uploadCV()" class="btn btn-primary btn-sm" style="width: 100%;">Tải tệp CV lên</button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <div th:replace="~{layout/fragments :: footer}"></div>
    </div>
</div>

<!-- App JS -->
<script th:src="@{/js/app.js}"></script>
<!-- Page JS -->
<script th:src="@{/js/profile.js}"></script>
</body>
</html>
